name: Garde quotidienne

on:
  schedule:
    # Toutes les heures de 00:20 à 13:20 UTC : la première exécution qui trouve la liste du jour
    # sur les deux sites la publie, les suivantes ne changent rien.
    - cron: '20 0-13 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garde-quotidienne
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Récupérer la garde du jour
        id: scrape
        run: npm run scrape

      - name: Publier la liste statique sur Blogger
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: node scripts/publish-to-blogger.mjs

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/garde.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "garde: mise à jour du $(TZ=Africa/Casablanca date +%F)"
            git pull --rebase
            git push
          fi
