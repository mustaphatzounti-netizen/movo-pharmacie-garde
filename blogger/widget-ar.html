</div>

<style>
  /* Couleurs neutres et semi-transparentes : le widget hérite du texte et du fond du thème Blogger. */
  .pg {
    --pg-carte: rgba(127, 127, 127, .09); --pg-accent: #0a7d4f; --pg-accent-texte: #ffffff;
    --pg-alerte: rgba(240, 180, 0, .18); --pg-wa: #25D366; --pg-wa-texte: #0B2D48;
    font-family: inherit; color: inherit; max-width: 760px; margin: 0 auto; line-height: 1.45;
  }
  .pg * { box-sizing: border-box; }
  .pg-titre { margin: 0 0 4px; font-size: 1.35em; }
  .pg-titre-ar { margin: 0 0 12px; font-size: 1.15em; direction: rtl; opacity: .75; }
  .pg-periode, .pg-maj { opacity: .75; font-size: .92em; margin: 0 0 12px; }
  .pg-resume { margin: 0 0 12px; }
  .pg-alerte { background: var(--pg-alerte); padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; }
  .pg-outils { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .pg-info { margin: 0 0 12px; font-size: .9em; opacity: .8; }
  .pg-zone { margin: 18px 0 8px; font-size: 1.05em; }
  .pg-liste { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); padding: 0; margin: 0; list-style: none; }
  .pg-carte { background: var(--pg-carte); border-radius: 10px; padding: 12px 14px; }
  .pg-proche { box-shadow: inset 0 0 0 2px var(--pg-accent); }
  .pg-dist { margin: 0 0 4px; font-size: .85em; font-weight: 700; color: var(--pg-accent); }
  .pg-nom { margin: 0 0 4px; font-size: 1.05em; }
  .pg-type { margin: -6px 0 10px; font-size: .85em; font-weight: 600; color: var(--pg-accent); }
  .pg-adr { margin: 0 0 10px; opacity: .75; font-size: .93em; }
  .pg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .pg-btn { display: inline-block; padding: 7px 12px; border-radius: 6px; border: 0; text-decoration: none !important; font-family: inherit; font-size: .93em; font-weight: 600; line-height: 1.45; cursor: pointer; }
  .pg-btn-tel, .pg-btn-proche { background: var(--pg-accent); color: var(--pg-accent-texte) !important; }
  .pg-btn-carte { border: 1px solid var(--pg-accent); color: var(--pg-accent) !important; background: transparent; }
  .pg-btn-wa, .pg-btn-livrer { background: var(--pg-wa); color: var(--pg-wa-texte) !important; }
  .pg-demain { margin: 22px 0 14px; }
  .pg-demain summary { cursor: pointer; font-weight: 600; }
  .pg-urgence { margin-top: 20px; font-size: .92em; opacity: .75; }
</style>

<script>
(function () {
  var racine = document.getElementById('pg-garde');
  if (!racine) return;

  // \u00c0 adapter si le d\u00e9p\u00f4t change de propri\u00e9taire, de nom ou de branche.
  var URL_DONNEES = 'https://raw.githubusercontent.com/mustaphatzounti-netizen/movo-pharmacie-garde/main/public/garde.json';
  var URL_PAGE = 'https://ar.agadir-livraison.com/p/saydaliya-hirasa-agadir.html';
  var WHATSAPP_MOVO = '212605577990';
  var etat = { pharmacies: [], resultats: null, info: null, trie: false };

  function el(tag, cls, texte) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (texte != null) n.textContent = texte;
    return n;
  }

  function localParts(fuseau) {
    var p = {};
    new Intl.DateTimeFormat('en-CA', {
      timeZone: fuseau, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    return { date: p.year + '-' + p.month + '-' + p.day, heure: p.hour + ':' + p.minute };
  }

  function addDays(date, n) {
    var d = new Date(date + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function dateLisible(date) {
    return new Date(date + 'T12:00:00Z').toLocaleDateString('ar-MA-u-nu-latn', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
    });
  }

  // \u062c\u0645\u0644\u0629-\u062c\u0648\u0627\u0628 \u0627\u0644\u064a\u0648\u0645 (\u0646\u0641\u0633 \u0646\u0635 \u0627\u0644\u0644\u0627\u0626\u062d\u0629 \u0627\u0644\u062b\u0627\u0628\u062a\u0629 \u0627\u0644\u062a\u064a \u064a\u0646\u0634\u0631\u0647\u0627 GitHub Actions).
  function resume(pharmacies, date) {
    var n = pharmacies.length;
    var tous24 = pharmacies.every(function (p) { return p.garde === '24h/24'; });
    var noms = pharmacies.map(function (p) { return p.nom; });
    var liste = noms.length > 1 ? noms.slice(0, -1).join('\u060c ') + ' \u0648' + noms[noms.length - 1] : (noms[0] || '');
    return '\u0635\u064a\u062f\u0644\u064a\u0627\u062a \u0627\u0644\u062d\u0631\u0627\u0633\u0629 \u0641\u064a \u0623\u0643\u0627\u062f\u064a\u0631 \u0627\u0644\u064a\u0648\u0645\u060c ' + dateLisible(date) + ' ' + date.slice(0, 4) + '\u060c \u0639\u062f\u062f\u0647\u0627 ' + n + ': ' + liste + (tous24 ? '\u060c \u0643\u0644\u0647\u0627 \u0645\u0641\u062a\u0648\u062d\u0629 24/24' : '') + '.';
  }

  function lienCarte(p) {
    var q = (p.lat != null && p.lng != null) ? p.lat + ',' + p.lng : [p.nom, p.adresse, p.quartier, 'Agadir'].filter(Boolean).join(', ');
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }

  // Bouton WhatsApp MOVO : livraison depuis cette pharmacie de garde.
  function lienLivraison(p) {
    return 'https://wa.me/' + WHATSAPP_MOVO + '?text=' + encodeURIComponent(
      '\u0627\u0644\u0633\u0644\u0627\u0645 \u0639\u0644\u064a\u0643\u0645 MOVO\u060c \u0628\u063a\u064a\u062a \u062a\u0648\u0635\u0644\u0648\u0646\u064a \u062f\u0648\u0627 \u0645\u0646 ' + p.nom + ' (\u0635\u064a\u062f\u0644\u064a\u0629 \u0627\u0644\u062d\u0631\u0627\u0633\u0629\u060c \u0623\u0643\u0627\u062f\u064a\u0631).');
  }

  // Partage de la liste du jour sur WhatsApp.
  function lienPartage(pharmacies, date) {
    var lignes = ['\u0635\u064a\u062f\u0644\u064a\u0627\u062a \u0627\u0644\u062d\u0631\u0627\u0633\u0629 \u0641\u064a \u0623\u0643\u0627\u062f\u064a\u0631 \u2014 ' + dateLisible(date) + ':'];
    pharmacies.forEach(function (p) { lignes.push('\u2022 ' + p.nom + (p.telephone ? ' \u2014 ' + p.telephone : '')); });
    lignes.push('', '\u0627\u0644\u0644\u0627\u0626\u062d\u0629 \u0645\u062d\u062f\u062b\u0629: ' + URL_PAGE);
    return 'https://wa.me/?text=' + encodeURIComponent(lignes.join('\n'));
  }

  // Distance \u00e0 vol d'oiseau (km), calcul\u00e9e sur l'appareil : la position n'est envoy\u00e9e nulle part.
  function distanceKm(a, b) {
    var R = 6371, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function formatDistance(km) {
    return km < 1 ? (Math.round(km * 100) * 10) + ' \u0645' : km.toFixed(1).replace('.', ',') + ' \u0643\u0645';
  }

  function carte(p, rang) {
    var proche = etat.trie && rang === 0 && p._d != null;
    var li = el('li', 'pg-carte' + (proche ? ' pg-proche' : ''));
    if (etat.trie && p._d != null) {
      li.appendChild(el('p', 'pg-dist', (proche ? '\u0627\u0644\u0623\u0642\u0631\u0628 \u00b7 ' : '') + '\u0639\u0644\u0649 \u0628\u0639\u062f ' + formatDistance(p._d)));
    }
    var nom = el('h3', 'pg-nom', p.nom);
    nom.dir = 'auto';
    li.appendChild(nom);
    var adr = el('p', 'pg-adr', [p.quartier, p.adresse].filter(Boolean).join(' \u2014 '));
    adr.dir = 'auto';
    li.appendChild(adr);
    if (p.garde) li.appendChild(el('p', 'pg-type', '\u062d\u0631\u0627\u0633\u0629 ' + p.garde));
    var actions = el('div', 'pg-actions');
    if (p.telephone) {
      var tel = el('a', 'pg-btn pg-btn-tel', '\ud83d\udcde ');
      var num = el('span', null, p.telephone);
      num.dir = 'ltr';
      tel.appendChild(num);
      tel.href = 'tel:' + p.telephone.replace(/\s+/g, '');
      actions.appendChild(tel);
    }
    var map = el('a', 'pg-btn pg-btn-carte', '\u0627\u0644\u0637\u0631\u064a\u0642');
    map.href = lienCarte(p);
    map.target = '_blank';
    map.rel = 'noopener';
    actions.appendChild(map);
    var livrer = el('a', 'pg-btn pg-btn-livrer', '\ud83d\udef5 \u0648\u0635\u0651\u0644\u0647\u0627 \u0644\u064a');
    livrer.href = lienLivraison(p);
    livrer.target = '_blank';
    livrer.rel = 'noopener';
    actions.appendChild(livrer);
    li.appendChild(actions);
    return li;
  }

  function listeParZone(pharmacies, parent) {
    var zones = {};
    pharmacies.forEach(function (p) { (zones[p.zone || 'Agadir'] = zones[p.zone || 'Agadir'] || []).push(p); });
    var noms = Object.keys(zones);
    noms.forEach(function (z) {
      if (noms.length > 1) parent.appendChild(el('h3', 'pg-zone', z === 'Agadir' ? '\u0623\u0643\u0627\u062f\u064a\u0631' : z));
      var ul = el('ul', 'pg-liste');
      zones[z].forEach(function (p, i) { ul.appendChild(carte(p, i)); });
      parent.appendChild(ul);
    });
  }

  function dessinerListe() {
    var zone = etat.resultats;
    zone.textContent = '';
    if (etat.trie) {
      var ul = el('ul', 'pg-liste');
      etat.pharmacies.forEach(function (p, i) { ul.appendChild(carte(p, i)); });
      zone.appendChild(ul);
    } else {
      listeParZone(etat.pharmacies, zone);
    }
  }

  function info(texte) {
    etat.info.textContent = texte;
    etat.info.hidden = false;
  }

  function plusProche() {
    if (!navigator.geolocation) {
      info('\u062a\u062d\u062f\u064a\u062f \u0627\u0644\u0645\u0648\u0642\u0639 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d \u0641\u064a \u0647\u0630\u0627 \u0627\u0644\u062c\u0647\u0627\u0632: \u0627\u062e\u062a\u0631 \u0645\u0646 \u0627\u0644\u0644\u0627\u0626\u062d\u0629 \u0623\u0633\u0641\u0644\u0647.');
      return;
    }
    info('\u062c\u0627\u0631\u064d \u062a\u062d\u062f\u064a\u062f \u0645\u0648\u0642\u0639\u0643\u2026');
    navigator.geolocation.getCurrentPosition(function (pos) {
      var ici = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      etat.pharmacies.forEach(function (p) {
        p._d = (p.lat != null && p.lng != null) ? distanceKm(ici, p) : null;
      });
      etat.pharmacies.sort(function (a, b) {
        if (a._d == null && b._d == null) return 0;
        if (a._d == null) return 1;
        if (b._d == null) return -1;
        return a._d - b._d;
      });
      etat.trie = true;
      info('\u0627\u0644\u0644\u0627\u0626\u062d\u0629 \u0645\u0631\u062a\u0628\u0629 \u0645\u0646 \u0627\u0644\u0623\u0642\u0631\u0628 \u0625\u0644\u0649 \u0627\u0644\u0623\u0628\u0639\u062f (\u0627\u0644\u0645\u0633\u0627\u0641\u0629 \u0628\u062e\u0637 \u0645\u0633\u062a\u0642\u064a\u0645). \u0645\u0648\u0642\u0639\u0643 \u064a\u0628\u0642\u0649 \u0641\u064a \u062c\u0647\u0627\u0632\u0643.');
      dessinerListe();
    }, function () {
      info('\u0644\u0645 \u0646\u062a\u0645\u0643\u0646 \u0645\u0646 \u062a\u062d\u062f\u064a\u062f \u0645\u0648\u0642\u0639\u0643: \u0627\u0633\u0645\u062d \u0628\u062a\u062d\u062f\u064a\u062f \u0627\u0644\u0645\u0648\u0642\u0639 \u0641\u064a \u0627\u0644\u0645\u062a\u0635\u0641\u062d\u060c \u0623\u0648 \u0627\u062e\u062a\u0631 \u0645\u0646 \u0627\u0644\u0644\u0627\u0626\u062d\u0629 \u0623\u0633\u0641\u0644\u0647.');
    }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
  }

  function outils(pharmacies, date) {
    var barre = el('div', 'pg-outils');
    var proche = el('button', 'pg-btn pg-btn-proche', '\ud83d\udccd \u0623\u0642\u0631\u0628 \u0635\u064a\u062f\u0644\u064a\u0629 \u0644\u064a');
    proche.type = 'button';
    proche.addEventListener('click', plusProche);
    barre.appendChild(proche);
    var partage = el('a', 'pg-btn pg-btn-wa', '\u0623\u0631\u0633\u0644 \u0627\u0644\u0644\u0627\u0626\u062d\u0629 \u0641\u064a \u0648\u0627\u062a\u0633\u0627\u0628');
    partage.href = lienPartage(pharmacies, date);
    partage.target = '_blank';
    partage.rel = 'noopener';
    barre.appendChild(partage);
    racine.appendChild(barre);
    etat.info = el('p', 'pg-info');
    etat.info.hidden = true;
    racine.appendChild(etat.info);
  }

  // Titre H1 de la page avec la date du jour (seulement sur cette page : le script est dans son contenu).
  function titreDuJour(date) {
    var h1 = document.querySelector('.page-hero-copy h1, .page-hero h1, .entry-head h1, article h1');
    if (h1) h1.textContent = '\u0635\u064a\u062f\u0644\u064a\u0629 \u0627\u0644\u062d\u0631\u0627\u0633\u0629 \u0623\u0643\u0627\u062f\u064a\u0631 \u0627\u0644\u064a\u0648\u0645 24/24 \u2014 ' + dateLisible(date);
  }

  function afficher(data) {
    var maintenant = localParts(data.fuseau);
    var aujourdhui = maintenant.heure < data.heure_bascule ? addDays(maintenant.date, -1) : maintenant.date;
    var parDate = {};
    data.jours.forEach(function (j) { parDate[j.date] = j.pharmacies; });

    racine.textContent = '';
    racine.appendChild(el('h2', 'pg-titre', '\u0635\u064a\u062f\u0644\u064a\u0627\u062a \u0627\u0644\u062d\u0631\u0627\u0633\u0629 \u0641\u064a \u0623\u0643\u0627\u062f\u064a\u0631 \u0627\u0644\u064a\u0648\u0645'));
    var sousTitre = el('p', 'pg-titre-ar', 'Pharmacies de garde Agadir');
    sousTitre.lang = 'fr';
    sousTitre.dir = 'ltr';
    racine.appendChild(sousTitre);
    racine.appendChild(el('p', 'pg-periode', '\u062d\u0631\u0627\u0633\u0629 \u064a\u0648\u0645 ' + dateLisible(aujourdhui) + '.'));
    var listeDuJour = parDate[aujourdhui];
    if (listeDuJour && listeDuJour.length) racine.appendChild(el('p', 'pg-resume', resume(listeDuJour, aujourdhui)));

    if (data.exemple) {
      racine.appendChild(el('p', 'pg-alerte', '\u0628\u064a\u0627\u0646\u0627\u062a \u062a\u062c\u0631\u064a\u0628\u064a\u0629: \u0627\u0644\u0644\u0627\u0626\u062d\u0629 \u0627\u0644\u062d\u0642\u064a\u0642\u064a\u0629 \u0644\u0644\u0635\u064a\u062f\u0644\u064a\u0627\u062a \u0644\u0645 \u062a\u064f\u062f\u062e\u0644 \u0628\u0639\u062f.'));
    }

    var liste = parDate[aujourdhui];
    var hier = parDate[addDays(aujourdhui, -1)];
    var affichee = null, dateAffichee = aujourdhui;
    if ((!liste || !liste.length) && hier && hier.length) {
      racine.appendChild(el('p', 'pg-alerte',
        '\u0644\u0627\u0626\u062d\u0629 \u0627\u0644\u064a\u0648\u0645 \u0644\u0645 \u062a\u064f\u0646\u0634\u0631 \u0628\u0639\u062f: \u0647\u0630\u0647 \u062d\u0631\u0627\u0633\u0629 \u0627\u0644\u0628\u0627\u0631\u062d (' + dateLisible(addDays(aujourdhui, -1)) +
        ')\u060c \u063a\u0627\u0644\u0628\u0627\u064b \u0645\u0627\u0632\u0627\u0644\u062a \u0635\u0627\u0644\u062d\u0629 \u0641\u064a \u0627\u0644\u0635\u0628\u0627\u062d. \u0627\u062a\u0635\u0644 \u0628\u0627\u0644\u0635\u064a\u062f\u0644\u064a\u0629 \u0642\u0628\u0644 \u0623\u0646 \u062a\u062a\u0646\u0642\u0644.'));
      affichee = hier;
      dateAffichee = addDays(aujourdhui, -1);
    } else if (!liste || !liste.length) {
      racine.appendChild(el('p', 'pg-alerte', '\u0644\u0627\u0626\u062d\u0629 \u062d\u0631\u0627\u0633\u0629 \u0627\u0644\u064a\u0648\u0645 \u0644\u0645 \u062a\u064f\u062d\u062f\u062b \u0628\u0639\u062f. \u062a\u062d\u0642\u0642 \u0641\u064a agadir.pharmacieenpermanence.ma \u0623\u0648 \u0627\u062a\u0635\u0644 \u0628\u0640 141 (SAMU) \u0641\u064a \u062d\u0627\u0644\u0629 \u0627\u0644\u0637\u0648\u0627\u0631\u0626.'));
    } else {
      affichee = liste;
    }

    if (affichee) {
      etat.pharmacies = affichee.map(function (p) { var c = {}; for (var k in p) c[k] = p[k]; return c; });
      etat.trie = false;
      outils(etat.pharmacies, dateAffichee);
      etat.resultats = el('div', 'pg-resultats');
      racine.appendChild(etat.resultats);
      dessinerListe();
    }

    var maj = el('p', 'pg-maj', '\u062d\u0633\u0628 Telecontact \u0648Annuaire Gratuit \u0648Le Matin (\u0646\u0639\u0631\u0636 \u0641\u0642\u0637 \u0627\u0644\u0635\u064a\u062f\u0644\u064a\u0627\u062a \u0627\u0644\u062a\u064a \u064a\u0630\u0643\u0631\u0647\u0627 \u0645\u0635\u062f\u0631\u0627\u0646 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644). \u0622\u062e\u0631 \u062a\u062d\u062f\u064a\u062b: ');
    var majDate = el('span', null, new Date(data.genere_le).toLocaleString('fr-FR', { timeZone: data.fuseau }));
    majDate.dir = 'ltr';
    maj.appendChild(majDate);
    maj.appendChild(document.createTextNode('. \u0627\u062a\u0635\u0644 \u0628\u0627\u0644\u0635\u064a\u062f\u0644\u064a\u0629 \u0642\u0628\u0644 \u0623\u0646 \u062a\u062a\u0646\u0642\u0644.'));
    racine.appendChild(maj);
    racine.appendChild(el('p', 'pg-urgence', '\u0627\u0644\u0637\u0648\u0627\u0631\u0626: \u0627\u0644\u0625\u0633\u0639\u0627\u0641 141 \u00b7 \u0627\u0644\u0648\u0642\u0627\u064a\u0629 \u0627\u0644\u0645\u062f\u0646\u064a\u0629 150 \u00b7 \u0627\u0644\u0634\u0631\u0637\u0629 19'));
    titreDuJour(aujourdhui);
  }

  // En cas d'\u00e9chec du chargement, on garde la liste statique publi\u00e9e dans la page (si elle existe).
  function erreur() {
    if (racine.querySelector('.pg-carte')) {
      var b = racine.querySelector('.pg-btn-proche');
      if (b) b.hidden = true;
      return;
    }
    racine.textContent = '';
    racine.appendChild(el('p', 'pg-alerte', '\u062a\u0639\u0630\u0651\u0631 \u062a\u062d\u0645\u064a\u0644 \u0644\u0627\u0626\u062d\u0629 \u0635\u064a\u062f\u0644\u064a\u0627\u062a \u0627\u0644\u062d\u0631\u0627\u0633\u0629. \u062d\u0627\u0648\u0644 \u0644\u0627\u062d\u0642\u0627\u064b \u0623\u0648 \u0627\u062a\u0635\u0644 \u0628\u0640 141 \u0641\u064a \u062d\u0627\u0644\u0629 \u0627\u0644\u0637\u0648\u0627\u0631\u0626.'));
  }

  fetch(URL_DONNEES + '?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(afficher)
    .catch(erreur);
})();
</script>
