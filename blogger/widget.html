<!--
  Pharmacies de garde — Agadir : widget pour une page Blogger.
  Coller tout ce bloc dans la page, en mode « Vue HTML » (pas « Vue composition »).
  Les données viennent de public/garde.json, mis à jour chaque matin par GitHub Actions
  à partir de pharmacieenpermanence.ma et annuaire-gratuit.ma (recoupés). Coller une seule fois.
-->
<div id="pg-garde" class="pg" lang="fr">
  <p class="pg-etat">Chargement des pharmacies de garde…</p>
</div>

<style>
  /* Couleurs neutres et semi-transparentes : le widget hérite du texte et du fond du thème Blogger. */
  .pg {
    --pg-carte: rgba(127, 127, 127, .09); --pg-accent: #0a7d4f; --pg-accent-texte: #ffffff;
    --pg-alerte: rgba(240, 180, 0, .18);
    font-family: inherit; color: inherit; max-width: 760px; margin: 0 auto; line-height: 1.45;
  }
  .pg * { box-sizing: border-box; }
  .pg-titre { margin: 0 0 4px; font-size: 1.35em; }
  .pg-titre-ar { margin: 0 0 12px; font-size: 1.15em; direction: rtl; opacity: .75; }
  .pg-periode, .pg-maj { opacity: .75; font-size: .92em; margin: 0 0 12px; }
  .pg-alerte { background: var(--pg-alerte); padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; }
  .pg-zone { margin: 18px 0 8px; font-size: 1.05em; }
  .pg-liste { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); padding: 0; margin: 0; list-style: none; }
  .pg-carte { background: var(--pg-carte); border-radius: 10px; padding: 12px 14px; }
  .pg-nom { margin: 0 0 4px; font-size: 1.05em; }
  .pg-type { margin: -6px 0 10px; font-size: .85em; font-weight: 600; color: var(--pg-accent); }
  .pg-adr { margin: 0 0 10px; opacity: .75; font-size: .93em; }
  .pg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .pg-btn { display: inline-block; padding: 7px 12px; border-radius: 6px; text-decoration: none !important; font-size: .93em; font-weight: 600; }
  .pg-btn-tel { background: var(--pg-accent); color: var(--pg-accent-texte) !important; }
  .pg-btn-carte { border: 1px solid var(--pg-accent); color: var(--pg-accent) !important; }
  .pg-demain { margin: 22px 0 14px; }
  .pg-demain summary { cursor: pointer; font-weight: 600; }
  .pg-urgence { margin-top: 20px; font-size: .92em; opacity: .75; }
</style>

<script>
(function () {
  // À adapter si le dépôt change de propriétaire, de nom ou de branche.
  var URL_DONNEES = 'https://raw.githubusercontent.com/mustaphatzounti-netizen/movo-pharmacie-garde/main/public/garde.json';

  var racine = document.getElementById('pg-garde');

  function el(tag, cls, texte) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (texte != null) n.textContent = texte;
    return n;
  }

  function localParts(fuseau) {
    var p = {};
    new Intl.DateTimeFormat('en-CA', {
      timeZone: fuseau, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    return { date: p.year + '-' + p.month + '-' + p.day, heure: p.hour + ':' + p.minute };
  }

  function addDays(date, n) {
    var d = new Date(date + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function dateLisible(date) {
    return new Date(date + 'T12:00:00Z').toLocaleDateString('fr-FR', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'
    });
  }

  function lienCarte(p) {
    var q = (p.lat != null && p.lng != null) ? p.lat + ',' + p.lng : [p.nom, p.adresse, p.quartier, 'Agadir'].filter(Boolean).join(', ');
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }

  function carte(p) {
    var li = el('li', 'pg-carte');
    li.appendChild(el('h3', 'pg-nom', p.nom));
    li.appendChild(el('p', 'pg-adr', [p.quartier, p.adresse].filter(Boolean).join(' — ')));
    if (p.garde) li.appendChild(el('p', 'pg-type', 'Garde ' + p.garde));
    var actions = el('div', 'pg-actions');
    if (p.telephone) {
      var tel = el('a', 'pg-btn pg-btn-tel', '📞 ' + p.telephone);
      tel.href = 'tel:' + p.telephone.replace(/\s+/g, '');
      actions.appendChild(tel);
    }
    var map = el('a', 'pg-btn pg-btn-carte', 'Itinéraire');
    map.href = lienCarte(p);
    map.target = '_blank';
    map.rel = 'noopener';
    actions.appendChild(map);
    li.appendChild(actions);
    return li;
  }

  function listeParZone(pharmacies, parent) {
    var zones = {};
    pharmacies.forEach(function (p) { (zones[p.zone || 'Agadir'] = zones[p.zone || 'Agadir'] || []).push(p); });
    var noms = Object.keys(zones);
    noms.forEach(function (z) {
      if (noms.length > 1) parent.appendChild(el('h3', 'pg-zone', z));
      var ul = el('ul', 'pg-liste');
      zones[z].forEach(function (p) { ul.appendChild(carte(p)); });
      parent.appendChild(ul);
    });
  }

  function afficher(data) {
    var maintenant = localParts(data.fuseau);
    var aujourdhui = maintenant.heure < data.heure_bascule ? addDays(maintenant.date, -1) : maintenant.date;
    var parDate = {};
    data.jours.forEach(function (j) { parDate[j.date] = j.pharmacies; });

    racine.textContent = '';
    racine.appendChild(el('h2', 'pg-titre', 'Pharmacies de garde à ' + (data.ville || 'Agadir')));
    racine.appendChild(el('p', 'pg-titre-ar', 'صيدليات الحراسة بأكادير'));
    racine.appendChild(el('p', 'pg-periode',
      'Garde du ' + dateLisible(aujourdhui) + ' à ' + data.heure_bascule +
      ' au ' + dateLisible(addDays(aujourdhui, 1)) + ' à ' + data.heure_bascule + '.'));

    if (data.exemple) {
      racine.appendChild(el('p', 'pg-alerte',
        'Données d\'exemple : la liste réelle des pharmacies n\'a pas encore été saisie.'));
    }

    var liste = parDate[aujourdhui];
    if (!liste || !liste.length) {
      racine.appendChild(el('p', 'pg-alerte',
        'La liste de garde d\'aujourd\'hui n\'est pas encore mise à jour. Vérifiez sur agadir.pharmacieenpermanence.ma ou appelez le 141 (SAMU) en cas d\'urgence.'));
    } else {
      listeParZone(liste, racine);
    }

    var demain = parDate[addDays(aujourdhui, 1)];
    if (false && demain && demain.length) {
      var det = el('details', 'pg-demain');
      det.appendChild(el('summary', null, 'Garde suivante (' + dateLisible(addDays(aujourdhui, 1)) + ')'));
      listeParZone(demain, det);
      racine.appendChild(det);
    }

    racine.appendChild(el('p', 'pg-maj',
      'D\'après Pharmacie en permanence et Annuaire Gratuit. Mis à jour le ' + new Date(data.genere_le).toLocaleString('fr-FR', { timeZone: data.fuseau }) +
      '. Appelez la pharmacie avant de vous déplacer.'));
    racine.appendChild(el('p', 'pg-urgence', 'Urgences : SAMU 141 · Protection civile 150 · Police 19'));
  }

  function erreur() {
    racine.textContent = '';
    racine.appendChild(el('p', 'pg-alerte',
      'Impossible de charger la liste des pharmacies de garde. Réessayez plus tard ou appelez le 141 en cas d\'urgence.'));
  }

  fetch(URL_DONNEES + '?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(afficher)
    .catch(erreur);
})();
</script>
